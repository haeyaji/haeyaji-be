<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#EFEDE8;">
<tr><td align="center" style="padding:24px 12px;">
  <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="width:600px;max-width:100%;background:#FFFFFF;border-radius:16px;overflow:hidden;">

    <tr><td style="background:#15795A;padding:22px 28px;">
      <span style="font-size:17px;font-weight:800;color:#FFFFFF;letter-spacing:-0.3px;">해야지</span>
      <span style="font-size:13px;color:#B7DCCB;padding-left:8px;">날씨 기반 추천 투두</span>
    </td></tr>

    <tr><td style="padding:32px 28px 8px;">
      <p style="margin:0 0 6px;font-size:13px;font-weight:700;color:#15795A;">약속 초대</p>
      <h1 style="margin:0 0 14px;font-size:22px;line-height:1.4;font-weight:800;color:#17150F;letter-spacing:-0.4px;">
        {{meetingTitle}}
      </h1>
      <p style="margin:0 0 24px;font-size:15px;line-height:1.7;color:#5A554B;">
        {{inviterLine}}<br>
        가능한 시간을 골라주면 <b style="color:#17150F;">모두에게 맞는 시간</b>을 찾아드릴게요.
      </p>
    </td></tr>

    <tr><td style="padding:0 28px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#E4F2EC;border-radius:12px;">
        <tr><td style="padding:16px 18px;font-size:14px;line-height:1.6;color:#15795A;">
          참여자가 모두 응답하거나 마감 시각이 지나면 가능한 시간대가 공개돼요.
        </td></tr>
      </table>
    </td></tr>

    <tr><td style="padding:24px 28px 32px;">
      <table role="presentation" cellpadding="0" cellspacing="0">
        <tr><td style="background:#17150F;border-radius:12px;">
          <a href="{{link}}" style="display:inline-block;padding:14px 28px;font-size:15px;font-weight:700;color:#FFFFFF;text-decoration:none;">
            가능한 시간 고르기
          </a>
        </td></tr>
      </table>
      <p style="margin:14px 0 0;font-size:12px;line-height:1.6;color:#A39C8E;">
        버튼이 눌리지 않으면 아래 주소를 복사해 열어주세요.<br>
        <span style="color:#8B8579;word-break:break-all;">{{link}}</span>
      </p>
    </td></tr>

    <tr><td style="border-top:1px solid #E7EAEF;padding:18px 28px 24px;">
      <p style="margin:0;font-size:12px;line-height:1.7;color:#A39C8E;">
        이 메일은 해야지에서 보낸 알림이에요. 회신하지 않아도 됩니다.
      </p>
    </td></tr>

  </table>
</td></tr>
</table>
