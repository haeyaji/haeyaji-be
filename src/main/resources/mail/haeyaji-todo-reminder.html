<!doctype html>
<!-- 해야지 알림 메일 — 할 일 리마인더 (TODO_REMINDER · TODO_WEATHER_ALERT). 원본·디자인 규칙: docs/email/ -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="x-ua-compatible" content="ie=edge">
<meta name="color-scheme" content="light">
<meta name="supported-color-schemes" content="light">
<title>할 일 리마인더</title>
<style>
  body, table, td, a { -webkit-text-size-adjust:100%; -ms-text-size-adjust:100%; }
  table, td { mso-table-lspace:0pt; mso-table-rspace:0pt; }
  img { border:0; line-height:100%; outline:none; text-decoration:none; }
  a { color:#15795A; }
  @media only screen and (max-width:600px) {
    .container { width:100% !important; border-radius:0 !important; }
    .pad { padding-left:20px !important; padding-right:20px !important; }
    .h1 { font-size:20px !important; }
  }
</style>
</head>
<body style="margin:0;padding:0;background-color:#EFEDE8;">

<div style="display:none;max-height:0;overflow:hidden;mso-hide:all;font-size:1px;line-height:1px;color:#EFEDE8;opacity:0;">
  <!--{{?startTime}}-->{{startTime}}에 시작해요. <!--{{/startTime}}--><!--{{?weatherLine}}-->{{weatherLine}}<!--{{/weatherLine}}-->
  &zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;
</div>

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#EFEDE8" style="background-color:#EFEDE8;">
<tr><td align="center" style="padding:32px 16px;">

  <table role="presentation" class="container" width="600" cellpadding="0" cellspacing="0" border="0" bgcolor="#FFFFFF" style="width:600px;max-width:100%;background-color:#FFFFFF;border-radius:16px;">

    <tr><td class="pad" bgcolor="#15795A" style="background-color:#15795A;padding:22px 28px;border-radius:16px 16px 0 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;">
      <span style="font-size:17px;font-weight:bold;color:#FFFFFF;letter-spacing:-0.3px;">해야지</span>
      <span style="font-size:13px;color:#B7DCCB;padding-left:8px;">날씨 기반 추천 투두</span>
    </td></tr>

    <tr><td class="pad" style="padding:32px 28px 8px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;">
      <p style="margin:0 0 6px;font-size:13px;font-weight:bold;color:#C2702A;">곧 시작해요</p>
      <h1 class="h1" style="margin:0 0 14px;font-size:22px;line-height:1.4;font-weight:bold;color:#17150F;letter-spacing:-0.4px;">
        {{todoTitle}}
      </h1>
      <p style="margin:0 0 22px;font-size:15px;line-height:1.7;color:#5A554B;">
        <!--{{?startTime}}--><b style="color:#17150F;">{{startTime}}</b>에 시작해요. <!--{{/startTime}}--><!--{{?placeName}}-->장소는 {{placeName}}.<!--{{/placeName}}-->
      </p>
    </td></tr>

    <!-- 날씨 한 줄 — 이 서비스의 정체성. 날씨를 못 받았으면 상자째 빠진다 -->
    <!--{{?weatherLine}}-->
    <tr><td class="pad" style="padding:0 28px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#E4F2EC" style="background-color:#E4F2EC;border-radius:12px;">
        <tr><td style="padding:16px 18px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:14px;line-height:1.6;color:#15795A;">
          {{weatherLine}}
        </td></tr>
      </table>
    </td></tr>
    <!--{{/weatherLine}}-->

    <tr><td class="pad" style="padding:24px 28px 32px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;">
      <table role="presentation" cellpadding="0" cellspacing="0" border="0">
        <tr><td bgcolor="#17150F" style="background-color:#17150F;border-radius:12px;">
          <a href="{{link}}" target="_blank" style="display:inline-block;padding:14px 28px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:15px;font-weight:bold;color:#FFFFFF;text-decoration:none;">
            오늘 할 일 보기
          </a>
        </td></tr>
      </table>
      <p style="margin:14px 0 0;font-size:12px;line-height:1.6;color:#A39C8E;">
        버튼이 눌리지 않으면 아래 주소를 복사해 열어주세요.<br>
        <span style="color:#8B8579;word-break:break-all;">{{link}}</span>
      </p>
    </td></tr>

    <tr><td class="pad" style="border-top:1px solid #E7EAEF;padding:18px 28px 24px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;">
      <p style="margin:0;font-size:12px;line-height:1.7;color:#A39C8E;">
        이 메일은 해야지에서 보낸 알림이에요. 회신하지 않아도 됩니다.<br>
        리마인더는 프로필에서 끌 수 있어요.
      </p>
    </td></tr>

  </table>

</td></tr>
</table>

</body>
</html>
